<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Junior Astronaut — Mars Outpost Trainer</title>
    <!-- Inlined so the page makes no extra request and 404s nothing, which
         also means it still renders from a USB stick with no network. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%23c1603a%27/%3E%3Ccircle cx=%2711%27 cy=%2712%27 r=%273%27 fill=%27%238f4327%27/%3E%3Ccircle cx=%2721%27 cy=%2719%27 r=%274%27 fill=%27%238f4327%27/%3E%3Ccircle cx=%2713%27 cy=%2722%27 r=%272%27 fill=%27%238f4327%27/%3E%3C/svg%3E" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="description" content="Command a three-person Mars outpost. Balance power, life support, radiation shielding and food production across a 7-sol mission." />

    <!-- The boot screen is inlined in the document, not rendered by React.
         The app bundle carries React, three.js and the postprocessing chain,
         so there is a real gap between the first byte and the first frame —
         measured at ~2.3 s on a cold cache. Without this the demo opens on a
         blank black rectangle, which on a projector looks like a crash.
         React clears #root when it mounts, so this needs no teardown code. -->
    <style>
      html, body { margin: 0; background: #0b0f14; }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background:
          radial-gradient(ellipse 120% 80% at 50% 115%, #3a1d12 0%, transparent 60%),
          #0b0f14;
        color: #e8eef5;
        font: 400 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #boot .mk {
        width: 54px; height: 54px; border-radius: 50%;
        background: radial-gradient(circle at 34% 30%, #e08a5a, #c1603a 45%, #7e3a21 100%);
        box-shadow: 0 0 44px rgba(193, 96, 58, 0.45);
        animation: bootspin 14s linear infinite;
      }
      @keyframes bootspin { to { transform: rotate(360deg); } }
      #boot .ti {
        font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
        color: #9fb3c8;
      }
      #boot .na { font-size: 21px; font-weight: 600; letter-spacing: 0.02em; }
      #boot .ba {
        width: 190px; height: 2px; border-radius: 2px;
        background: rgba(159, 179, 200, 0.18); overflow: hidden;
      }
      #boot .ba i {
        display: block; width: 40%; height: 100%; border-radius: 2px;
        background: #c1603a; animation: bootbar 1.1s ease-in-out infinite;
      }
      @keyframes bootbar {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      #boot .no { font-size: 11px; color: #64788c; }
      /* A looping spinner is exactly what vestibular-sensitive users ask the
         browser to stop doing, and the text alone still says "loading". */
      @media (prefers-reduced-motion: reduce) {
        #boot .mk, #boot .ba i { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="mk"></div>
        <div class="ti">Mars: Last 30 Days</div>
        <div class="na">Junior Astronaut — Outpost Trainer</div>
        <div class="ba"><i></i></div>
        <div class="no">Loading mission systems&hellip;</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
